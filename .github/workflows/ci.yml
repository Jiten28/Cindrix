name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Python compile check
        run: python -m py_compile $(find app -name "*.py") run.py

      - name: Run tests
        env:
          GOOGLE_API_KEY: dummy-key-for-ci
        run: pytest tests/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend JS syntax check
        run: |
          for f in frontend/js/*.js; do
            node --check "$f"
          done

  # The test job runs on ubuntu-latest, which already has the OpenMP runtime
  # faiss's wheel needs — so it cannot catch a container that lacks it. That
  # exact gap let a build pass while `import faiss` failed at runtime and
  # knowledge-base retrieval was silently off in production. Building the real
  # image is what closes it: the Dockerfile asserts faiss imports and the
  # shipped index loads, so those become build failures here rather than a
  # deploy that looks healthy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t cindrix:ci .

      - name: Boot the image and check its self-report
        run: |
          docker run -d --name cindrix-ci -p 5000:5000 -e PORT=5000 cindrix:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:5000/health
          echo
          # /api/config reports what the container actually resolved. A
          # knowledgeBase.loaded of false here means the index didn't load in
          # the image, which is the failure this job exists to catch.
          config=$(curl -fsS http://localhost:5000/api/config)
          echo "$config"
          echo "$config" | grep -q '"loaded": *true' \
            || { echo "::error::knowledge-base index did not load in the image"; docker logs cindrix-ci; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs cindrix-ci || true
