name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Python compile check
        run: python -m py_compile $(find app -name "*.py") run.py

      - name: Run tests
        env:
          GOOGLE_API_KEY: dummy-key-for-ci
        run: pytest tests/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend JS syntax check
        run: |
          for f in frontend/js/*.js; do
            node --check "$f"
          done
